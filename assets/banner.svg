<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes shimmer {
        0% { stop-color: #6366f1; }
        33% { stop-color: #ec4899; }
        66% { stop-color: #3b82f6; }
        100% { stop-color: #6366f1; }
      }
      @keyframes streamDrift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .card-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
      .card-2 { animation: float2 7s ease-in-out infinite; transform-origin: center; }
      .ambient-glow { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .pulse-stream {
        stroke-dasharray: 8 16;
        animation: streamDrift 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="280" x2="900" y2="280" />
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="ambient-glow" cx="160" cy="90" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="ambient-glow" cx="760" cy="220" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  <circle class="ambient-glow" cx="450" cy="290" r="100" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />

  <!-- Animated Data Streams / Vector Curves -->
  <path class="pulse-stream" d="M -20,60 Q 250,140 450,50 T 920,80" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.45" />
  <path class="pulse-stream" d="M -20,240 Q 300,180 520,270 T 920,230" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.4" />

  <!-- Floating Dynamic Background Cards (Asset Previews) -->
  <g class="card-1">
    <rect x="55" y="32" width="130" height="74" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
    <!-- Photo icon representation -->
    <rect x="68" y="44" width="40" height="30" rx="4" fill="#3b82f6" opacity="0.3" />
    <circle cx="80" cy="54" r="4" fill="#60a5fa" />
    <path d="M 70,72 L 84,58 L 98,72 Z" fill="#93c5fd" opacity="0.7" />
    <text x="116" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">4K Stock</text>
    <text x="116" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">RAW / HDR</text>
  </g>

  <g class="card-2">
    <rect x="715" y="45" width="135" height="78" rx="10" fill="url(#cardGrad1)" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
    <!-- DAM database icon -->
    <rect x="728" y="58" width="34" height="12" rx="3" fill="#ec4899" opacity="0.4" />
    <rect x="728" y="74" width="34" height="12" rx="3" fill="#ec4899" opacity="0.4" />
    <rect x="728" y="90" width="34" height="12" rx="3" fill="#ec4899" opacity="0.4" />
    <text x="770" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Self-Hosted</text>
    <text x="770" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">AI Tagging DAM</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Subtitle, Badges (always crisp, never obscured) -->
  <g id="foreground" filter="url(#softShadow)">
    <!-- Decorative top badge -->
    <rect x="350" y="32" width="200" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="365" cy="45" r="4" fill="#22c55e" />
    <text x="377" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Stock Media Marketplace
    </text>

    <!-- Vibrant Subtitle Gradient Bar -->
    <rect x="250" y="128" width="400" height="3" rx="1.5" fill="url(#primaryGrad)" />

    <!-- Subtitle / Mission Statement -->
    <text x="450" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e1">
      Top Commercial Marketplaces, Royalty-Free Libraries &amp; Open-Source DAM Systems
    </text>
    <text x="450" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">
      Empowering creators, video editors, and engineering teams with self-hosted &amp; enterprise media stacks
    </text>

    <!-- Feature Pills / Tags in Foreground -->
    <g transform="translate(145, 222)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="56" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">📸 Stock Photos</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(122, 0)">
        <rect width="108" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="54" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a855f7">🎥 4K Footage</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect width="120" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="60" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ec4899">🗄️ Open DAM</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(370, 0)">
        <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="57" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#10b981">✨ Royalty-Free</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(495, 0)">
        <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="57" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f59e0b">🤖 AI Tagging</text>
      </g>
    </g>
  </g>
</svg>
